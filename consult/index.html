<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>상담 센터</title>
<style>
:root { color-scheme: light; --bg: #f3f5f8; --panel: #fff; --line: #dbe1e9; --text: #18212e; --muted: #687384; --accent: #1f6feb; --red: #d92d20; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; gap: 16px; }
h1 { font-size: 22px; margin: 0 0 12px; }
.menu { display: grid; gap: 14px; width: min(360px, 100%); }
.menu button { font: inherit; font-size: 22px; font-weight: 700; padding: 26px 16px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
.menu button:hover { border-color: var(--accent); color: var(--accent); }
.modal { position: fixed; inset: 0; background: rgba(20,30,45,.45); display: none; align-items: center; justify-content: center; padding: 16px; }
.modal.open { display: flex; }
.box { width: min(340px, 100%); background: var(--panel); border-radius: 16px; padding: 22px; }
.box h2 { font-size: 18px; margin: 0 0 14px; }
.box input { width: 100%; font: inherit; font-size: 22px; letter-spacing: 6px; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
.box input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
.msg { min-height: 22px; font-size: 14px; color: var(--red); margin: 8px 0; }
.msg.info { color: var(--muted); }
.row { display: flex; gap: 8px; }
.row button { flex: 1; font: inherit; font-size: 16px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.row button.ok { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>상담 센터</h1>
  <div class="menu">
    <button data-go="internet">인터넷상담</button>
    <button data-go="lotto">로또상담</button>
  </div>
</main>

<div class="modal" id="modal">
  <form class="box" id="form" autocomplete="off">
    <h2 id="title">비밀번호</h2>
    <input id="pw" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
    <div class="msg" id="msg"></div>
    <div class="row">
      <button type="button" id="cancel">취소</button>
      <button type="submit" class="ok">확인</button>
    </div>
  </form>
</div>

<script>
// 메뉴별 비밀번호(SHA-256 해시)와 이동 주소. 비밀번호를 바꾸려면 해시만 바꾸면 됨.
const MENUS = {
  internet: { name: '인터넷상담', hash: '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4', url: '../internet-console/' },
  lotto:    { name: '로또상담',   hash: '5542f9c152f58f4788fe5a78247686cd688a5f2a0f71c37271e8d7dcce6fedbf', url: '../lotto-console/' },
};
const $ = (s) => document.querySelector(s);
let current = null;

async function sha256(t) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
}
function open(key) {
  current = key;
  $('#title').textContent = `${MENUS[key].name} 비밀번호`;
  $('#pw').value = ''; $('#msg').textContent = ''; $('#msg').className = 'msg';
  $('#modal').classList.add('open'); $('#pw').focus();
}
function close() { $('#modal').classList.remove('open'); current = null; }

document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => open(b.dataset.go)));
$('#cancel').onclick = close;
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') close(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });

$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const m = MENUS[current];
  if (await sha256($('#pw').value) !== m.hash) {
    $('#msg').textContent = '비밀번호가 맞지 않아요'; $('#pw').select(); return;
  }
  if (!m.url) { $('#msg').textContent = `${m.name}은 준비 중이에요`; $('#msg').className = 'msg info'; return; }
  try { sessionStorage.setItem('auth_' + current, '1'); } catch (_) {}
  location.href = m.url;
});
</script>
</body>
</html>
