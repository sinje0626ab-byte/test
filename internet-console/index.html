<script>
(() => {
'use strict';

/* ───────── 유틸 ───────── */
const $ = (s) => document.querySelector(s);
const won = (n) => (n == null || isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR');
const exVat = (v) => Math.round(v / 1.1);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CARRIERS = ['kt', 'lg', 'sk', 'sky'];
const SPEED_ORDER = ['100M', '200M', '500M', '1G'];
const SPEED_TALK = { '100M': '100메가', '200M': '200메가', '500M': '500메가', '1G': '1기가' };
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const CUR_TO_KEY = { 'KT': 'kt', 'LG U+': 'lg', 'SKB': 'sk', '스카이라이프': 'sky' };
const MOBILE_TO_KEY = { 'KT': 'kt', 'LG U+': 'lg', 'SKT': 'sk', '알뜰폰': 'sky' };

function parseDate(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtDate(s) { const d = parseDate(s); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일(${WEEK[d.getDay()]})` : ''; }
function fmtDateTalk(s) { const d = parseDate(s); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일` : ''; }

/* ───────── 상태 (고객 정보는 메모리에만 — 저장 안 함) ───────── */
const blankCust = () => ({ name: '', curCarrier: '', contractEnd: '', moveDate: '', installDate: '', installTime: '', mobile: '', biz: false, bizType: '', nextDay: '' });
const blankCalc = () => ({
  carrier: 'sk', type: 'tv', speed: '500M', tier: 3, productId: null,
  soho: false, combine: false, ktBracket: 'flat',
  usim: false, usimPlan: 69, usimKind: 'general',
  addons: {}, deds: {}, dayMode: 'auto',
});
let cust = blankCust();
let calc = blankCalc();
let step = 0;
let combineTouched = false;

/* ───────── 상품 선택 ───────── */
function productsOf(key, type) { return DATA[key].products.filter((p) => p.type === type); }
function speedsOf(key, type) { return SPEED_ORDER.filter((s) => productsOf(key, type).some((p) => p.speed === s)); }
function pickProduct(key, type, speed, tier, preferId) {
  const list = productsOf(key, type).filter((p) => p.speed === speed);
  if (!list.length) return null;
  if (preferId) { const f = list.find((p) => p.id === preferId); if (f) return f; }
  if (type === 'net') return list[0];
  const ranked = list.filter((p) => p.tier > 0).sort((a, b) => Math.abs(a.tier - tier) - Math.abs(b.tier - tier) || b.tier - a.tier);
  return ranked[0] || list[0];
}
function currentProduct() {
  const c = calc;
  if (!speedsOf(c.carrier, c.type).includes(c.speed)) c.speed = speedsOf(c.carrier, c.type).includes('500M') ? '500M' : speedsOf(c.carrier, c.type)[0];
  const p = pickProduct(c.carrier, c.type, c.speed, c.tier, c.productId);
  c.productId = p ? p.id : null;
  return p;
}
function installDay() {
  if (calc.dayMode !== 'auto') return calc.dayMode;
  const d = parseDate(cust.installDate);
  if (!d) return 'weekday';
  return (d.getDay() === 0 || d.getDay() === 6) ? 'weekend' : 'weekday';
}

/* ───────── 계산 ─────────
   opt.withExtras=false → 비교표용(추가상품/차감 제외) */
function compute(key, p, opt = {}) {
  const C = DATA[key];
  const withExtras = opt.withExtras !== false;
  const day = installDay();
  const r = { key, p, notes: [], blocked: [], items: [] };

  // 월요금
  let feeVat = p.feeVat, feeEx = p.exVat != null ? p.exVat : exVat(p.feeVat);
  let combVat = null, combEx = null, mobileDisc = null, combNote = '';
  if (calc.combine) {

    } else if (key === 'kt') {

      let disc;
      if (calc.ktBracket === 'flat') { disc = C.combine.flatNetDiscount; combNote = '정액결합 인터넷할인 5,500원'; }
      else { const i = +calc.ktBracket; disc = C.combine.netDiscount[sk][i]; mobileDisc = C.combine.mobileDiscount[sk][i] || null; combNote = `총액결합(휴대폰 ${C.combine.brackets[i]}) 인터넷할인 ${won(disc)}원`; }
      combVat = feeVat - disc; combEx = exVat(combVat);
    } else if (key === 'lg') {
      const disc = C.combine.netDiscount[p.speed];
      combVat = feeVat - disc; combEx = exVat(combVat); combNote = `참쉬운가족결합 인터넷할인 ${won(disc)}원 (추정)`;
    } else {
      combNote = '결합 할인표 없음 (스카이알뜰폰만 결합 가능)';

  let usim = 0;
  if (calc.usim) {

  // 기존 통신사 조건

    if (p.home30 && C.rules.home30BlockedFrom.includes(cust.curCarrier)) r.blocked.push(`기존 ${cust.curCarrier} 전환 — 30% 홈결합 불가`);

  if (withExtras) {
    for (const a of C.addons) {

      if (!v || !addonAllowed(a, p)) continue;

  }

  const baseInstall = C.install[p.type === 'net' ? 'net' : 'tv'][day];
  Object.assign(r, {
    feeVat: feeVat + addFee, feeEx: feeEx + exVat(addFee),
    combVat: combVat == null ? null : combVat + addFee, combEx: combEx == null ? null : combEx + exVat(addFee),
    mobileDisc, combNote, net, usim, addSup, carrierDeduct,
    total: net + usim + addSup + carrierDeduct,
    install: baseInstall + addInstall, baseInstall, day,
  });
  return r;
}
function addonAllowed(a, p) {
  if (a.discontinued) return false;
  if (a.tvOnly && p.type !== 'tv') return false;
  if (a.minSpeed && SPEED_ORDER.indexOf(p.speed) < SPEED_ORDER.indexOf(a.minSpeed)) return false;
  return true;
}

}

/* ───────── 렌더링 ───────── */
function agentName() { return ($('#agentName').value || '').trim(); }

function renderMonthBadges() {
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  $('#monthBadges').innerHTML = CARRIERS.map((k) => {
    const old = DATA[k].baseMonth < ym;
    return `<span class="badge ${old ? 'amber' : 'gray'}" title="${old ? '이번 달 정책으로 업데이트 필요' : ''}">${DATA[k].short} ${DATA[k].baseMonth.replace('-', '.')}${old ? ' ⚠' : ''}</span>`;
  }).join(' ') + (CARRIERS.some((k) => DATA[k].baseMonth < ym) ? ` <span class="badge amber">${now.getMonth() + 1}월 정책 업데이트 필요</span>` : '');
}

function seg(name, items, val, attrs = '') {
  return `<div class="seg">${items.map(([v, label, dis]) => `<button data-set="${name}" data-v="${esc(v)}" class="${String(v) === String(val) ? 'on' : ''}" ${dis ? 'disabled' : ''} ${attrs}>${esc(label)}</button>`).join('')}</div>`;
}

function renderCalc(p) {
  const C = DATA[calc.carrier], key = calc.carrier;
  const tvs = calc.type === 'tv' ? productsOf(key, 'tv').filter((x) => x.speed === calc.speed) : [];
  let h = `<h2>요금 계산기 <span class="mut">${esc(C.name)} · 대표번호 ${esc(C.phone)}</span></h2>`;
  h += `<div class="row"><div class="lb">통신사</div>${seg('carrier', CARRIERS.map((k) => [k, DATA[k].short]), key)}</div>`;
  if (key === 'lg') h += `<div class="row"><div class="lb">카테고리</div>${seg('soho', [['0', '일반'], ['1', '소호(사업장)']], calc.soho ? '1' : '0')}</div>`;
  h += `<div class="row"><div class="lb">상품 유형</div>${seg('type', [['net', '인터넷 단독'], ['tv', '인터넷+TV']], calc.type)}</div>`;
  h += `<div class="row"><div class="lb">속도</div>${seg('speed', SPEED_ORDER.filter((s) => s !== '200M' || key === 'sky').map((s) => [s, s, !speedsOf(key, calc.type).includes(s)]), calc.speed)}</div>`;
  if (calc.type === 'tv') h += `<div class="row"><div class="lb">TV 채널</div>${seg('productId', tvs.map((x) => [x.id, x.tv]), p && p.id)}</div>`;

  // 결합
  let comb = seg('combine', [['0', '미결합'], ['1', '휴대폰 결합']], calc.combine ? '1' : '0');
  if (calc.combine && key === 'kt') comb += `<div style="margin-top:6px"><select class="sm" data-set="ktBracket"><option value="flat" ${calc.ktBracket === 'flat' ? 'selected' : ''}>정액결합 (인터넷 -5,500)</option>${C.combine.brackets.map((b, i) => `<option value="${i}" ${String(calc.ktBracket) === String(i) ? 'selected' : ''}>총액결합 · 휴대폰 ${b}</option>`).join('')}</select></div>`;
  if (calc.combine && key === 'sky') comb += `<div class="mut" style="margin-top:4px">스카이 결합표 없음 (스카이알뜰폰만 가능)</div>`;
  h += `<div class="row"><div class="lb">휴대폰 결합</div><div>${comb}</div></div>`;

  // 유심 동판
  let us = seg('usim', [['0', '없음'], ['1', '유심 동판']], calc.usim ? '1' : '0');
  if (calc.usim) us += `<div style="margin-top:6px;display:flex;gap:6px;align-items:center"><select class="sm" data-set="usimPlan">${[33, 37, 43, 49, 61, 69, 80, 89].map((v) => `<option value="${v}" ${calc.usimPlan === v ? 'selected' : ''}>유심 ${v}k 이상</option>`).join('')}</select>${seg('usimKind', [['general', '일반(본인)'], ['family', '패밀리(가족)']], calc.usimKind)}</div>`;
  if (calc.usim && !C.usim) us += `<div class="mut" style="margin-top:4px">${C.short} 시트에 동판 표 없음</div>`;
  h += `<div class="row"><div class="lb">유심 동판</div><div>${us}</div></div>`;

  // 추가상품
  const groups = {};
  let ad = '';
  for (const a of C.addons) {
    const ok = p && addonAllowed(a, p);
    const why = a.discontinued ? '판매종료' : (a.tvOnly && p && p.type !== 'tv') ? 'TV 상품만' : (a.minSpeed && p && !ok) ? `${a.minSpeed} 이상` : '';
    const sup = `<span class="mut">${a.support ? `지원 ${a.support > 0 ? '+' : ''}${a.support}` : ''}</span>`;
    if (a.optionsFrom) {
      ad += `<div class="opt ${ok ? '' : 'dis'}">${esc(a.name)} <select class="sm" data-addon="${a.id}" ${ok ? '' : 'disabled'}><option value="">없음</option>${C[a.optionsFrom].map((o, i) => `<option value="${i + 1}" ${String(calc.addons[a.id]) === String(i + 1) ? 'selected' : ''}>${esc(o.label)} ${won(o.total)}원</option>`).join('')}</select> ${sup} <span class="mut">${why}</span></div>`;
    } else {
      ad += `<label class="opt ${ok ? '' : 'dis'}"><input type="checkbox" data-addon="${a.id}" ${a.group ? `data-group="${a.group}"` : ''} ${calc.addons[a.id] && ok ? 'checked' : ''} ${ok ? '' : 'disabled'}> ${esc(a.name)} <span class="mut">${a.feeVat ? won(a.feeVat) + '원' : ''}</span> ${sup} <span class="mut">${why}</span></label>`;
    }
  }
  h += `<div class="row"><div class="lb">추가 셋톱/<br>와이파이</div><div>${ad || '<span class="mut">없음</span>'}</div></div>`;
  if (C.deductions.length) h += `<div class="row"><div class="lb">차감</div><div>${C.deductions.map((d) => `<label class="opt"><input type="checkbox" data-ded="${d.id}" ${calc.deds[d.id] ? 'checked' : ''}> ${esc(d.name)} <span class="mut">${d.support}</span></label>`).join('')}</div></div>`;
  const autoLbl = cust.installDate ? `자동(${fmtDate(cust.installDate)})` : '자동(날짜 미입력→평일)';
  h += `<div class="row"><div class="lb">설치 요일</div>${seg('dayMode', [['auto', autoLbl], ['weekday', '평일'], ['weekend', '주말']], calc.dayMode)}</div>`;
  $('#calc').innerHTML = h;
}

function renderResult(r) {
  if (!r) { $('#result').innerHTML = '<div class="mut">상품 없음</div>'; return; }
  const items = r.items.map(([k, v]) => `${esc(k)} ${v > 0 ? '+' : ''}${v}`).join(' · ');
  $('#result').innerHTML = `
    <h2>계산 결과</h2>
    <p class="pname">${esc(DATA[r.key].short)} · ${esc(r.p.name)}${r.blocked.length ? ' <span class="badge red">접수 불가</span>' : ''}</p>
    <div class="res">
      <div class="box big"><div class="k">지원금 합계</div><div class="v">${r.total}만원</div><div class="breakdown">${items}</div></div>
      <div class="box"><div class="k">월요금 (VAT 제외)</div><div class="v">${won(r.feeEx)}원</div><div class="s">VAT 포함 ${won(r.feeVat)}원</div></div>
      <div class="box"><div class="k">결합 시 월요금 (VAT 제외)</div><div class="v">${r.combEx != null ? won(r.combEx) + '원' : '-'}</div><div class="s">${r.combVat != null ? `VAT 포함 ${won(r.combVat)}원 · ` : ''}${esc(r.combNote || (calc.combine ? '' : '결합 미선택'))}</div></div>
      <div class="box"><div class="k">설치비 (${r.day === 'weekend' ? '주말' : '평일'})</div><div class="v">${won(r.install)}원</div><div class="s">익월 요금에 1회 합산 청구${r.install !== r.baseInstall ? ` · 추가 ${won(r.install - r.baseInstall)}` : ''}</div></div>
      <div class="box"><div class="k">휴대폰 할인</div><div class="v">${r.mobileDisc ? won(r.mobileDisc) + '원' : '-'}</div><div class="s">${r.key === 'sk' ? '요즘가족 1회선 기준' : r.key === 'kt' ? '총액결합 구간 선택 시' : '시트 기준 없음'}</div></div>
    </div>`;
}

function renderCompare() {
  const rows = CARRIERS.map((k) => {
    const sp = speedsOf(k, calc.type).includes(calc.speed) ? calc.speed : null;
    const p = sp ? pickProduct(k, calc.type, sp, calc.tier) : null;
    return { k, r: p ? compute(k, p, { withExtras: false }) : null };
  });
  rows.sort((a, b) => (b.r ? b.r.total : -999) - (a.r ? a.r.total : -999));
  $('#compare').innerHTML = `<table class="cmp"><thead><tr><th>통신사 · 상품</th><th>월(VAT별도)</th><th>결합(VAT별도)</th><th>설치비</th><th>지원금</th></tr></thead><tbody>${
    rows.map(({ k, r }) => r ? `<tr class="${k === calc.carrier ? 'sel' : ''}" data-pick="${k}" style="cursor:pointer">
      <td><b>${esc(DATA[k].short)}</b> ${r.blocked.length ? '<span class="badge red">불가</span>' : ''}<br><span class="mut">${esc(r.p.name)}</span></td>
      <td>${won(r.feeEx)}<br><span class="mut">${won(r.feeVat)}</span></td>
      <td>${r.combEx != null ? won(r.combEx) : '-'}${r.combVat != null ? `<br><span class="mut">${won(r.combVat)}</span>` : ''}</td>
      <td>${won(r.install)}</td>
      <td><span class="sup">${r.total}</span><br><span class="mut">${r.net}${r.usim ? ` +동판${r.usim}` : ''}${r.carrierDeduct ? ` ${r.carrierDeduct}` : ''}</span></td></tr>`
      : `<tr><td><b>${esc(DATA[k].short)}</b></td><td colspan="4" class="na">${esc(calc.speed)} 상품 없음</td></tr>`).join('')
  }</tbody></table><div class="mut" style="margin-top:6px">행 클릭 → 그 통신사로 계산기 전환 · 아래 줄 숫자 = VAT 포함</div>`;
}

function renderWarns(r) {
  const w = warnings(r);
  $('#warns').innerHTML = w.map(([lv, t, d]) => `<div class="warn ${lv}"><span class="badge ${lv}">${esc(t)}</span><span>${esc(d)}</span></div>`).join('');
}

function renderScript(r) {
  const steps = buildSteps(r);
  step = Math.max(0, Math.min(step, steps.length - 1));
  $('#steps').innerHTML = steps.map((s, i) => `<button data-step="${i}" class="${i === step ? 'on' : i < step ? 'done' : ''}">${i + 1}. ${esc(s.t)}</button>`).join('');
  $('#card').innerHTML = `<div class="stitle">${step + 1}. ${esc(steps[step].t)}<span>${step + 1} / ${steps.length}</span></div>${steps[step].h}`;
  $('#pos').textContent = `${step + 1} / ${steps.length}`;
  $('#prev').disabled = step === 0;
  $('#next').disabled = step === steps.length - 1;
  return steps.length;
}

function summaryText(r) {
  if (!r) return '';
  const C = DATA[r.key];
  const parts = [];
  parts.push(`[${C.short}${r.key === 'lg' && calc.soho ? ' 소호' : ''}] ${r.p.name}`);
  const extras = r.items.slice(1).map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(', ');
  parts.push(`월 ${won(r.feeEx)}원(VAT별도)/${won(r.feeVat)}원(VAT포함)` + (r.combEx != null ? ` · 결합 ${won(r.combEx)}원(VAT별도)` : ''));
  parts.push(`지원금 총 ${r.total}만원 (인터넷 ${r.net}${extras ? ', ' + extras : ''})`);
  parts.push(`설치 ${cust.installDate ? fmtDate(cust.installDate) : '미정'}${cust.installTime ? ' ' + cust.installTime : ''} · 설치비 ${won(r.install)}원(${r.day === 'weekend' ? '주말' : '평일'})`);
  const c = [];
  if (cust.name) c.push(`고객 ${cust.name}`);
  if (cust.curCarrier) c.push(`현재 ${cust.curCarrier}${cust.contractEnd ? `(약정 ${cust.contractEnd})` : ''}`);
  if (cust.mobile) c.push(`휴대폰 ${cust.mobile}`);
  if (cust.moveDate) c.push(`이사 ${fmtDate(cust.moveDate)}`);
  if (cust.biz) c.push(`사업장${cust.bizType ? '(' + cust.bizType + ')' : ''}`);
  if (calc.usim) c.push(`유심 ${calc.usimPlan}k ${calc.usimKind === 'family' ? '패밀리' : '일반'}`);
  if (c.length) parts.push(c.join(' · '));
  return parts.join(' | ');
}

let lastResult = null;
function render() {
  const p = currentProduct();
  if (p && p.tier) calc.tier = p.tier;
  const r = p ? compute(calc.carrier, p) : null;
  lastResult = r;
  renderCalc(p);
  renderResult(r);
  renderCompare();
  renderWarns(r);
  renderScript(r);
  $('#summary').textContent = summaryText(r);
}

/* ───────── 이벤트 ───────── */
$('#custbar').addEventListener('input', (e) => {
  const f = e.target.dataset.f; if (!f) return;
  cust[f] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
  if (f === 'biz') calc.soho = cust.biz;
  if (f === 'mobile' && !combineTouched) calc.combine = MOBILE_TO_KEY[cust.mobile] === calc.carrier;
  render();
});
$('#agentName').addEventListener('input', () => { try { localStorage.setItem('consoleAgentName', agentName()); } catch (_) {} render(); });
try { $('#agentName').value = localStorage.getItem('consoleAgentName') || ''; } catch (_) {}

$('#side').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-set]');
  if (b) {
    const k = b.dataset.set, v = b.dataset.v;
    if (k === 'carrier') { calc.carrier = v; calc.productId = null; calc.addons = {}; calc.deds = {}; if (!combineTouched) calc.combine = MOBILE_TO_KEY[cust.mobile] === v; }
    else if (k === 'type') { calc.type = v; calc.productId = null; }
    else if (k === 'speed') { calc.speed = v; calc.productId = null; }
    else if (k === 'productId') { calc.productId = v; }
    else if (k === 'soho' || k === 'combine' || k === 'usim') { calc[k] = v === '1'; if (k === 'combine') combineTouched = true; }
    else calc[k] = v;
    render(); return;
  }
  const tr = e.target.closest('tr[data-pick]');
  if (tr) { calc.carrier = tr.dataset.pick; calc.productId = null; calc.addons = {}; calc.deds = {}; render(); }
});
$('#side').addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.set === 'ktBracket') calc.ktBracket = t.value;
  else if (t.dataset.set === 'usimPlan') calc.usimPlan = Number(t.value);
  else if (t.dataset.addon) {
    if (t.type === 'checkbox') {
      if (t.checked && t.dataset.group) DATA[calc.carrier].addons.filter((a) => a.group === t.dataset.group).forEach((a) => { calc.addons[a.id] = false; });
      calc.addons[t.dataset.addon] = t.checked;
    } else calc.addons[t.dataset.addon] = t.value;
  } else if (t.dataset.ded) calc.deds[t.dataset.ded] = t.checked;
  else return;
  render();
});

function go(d) { step += d; render(); }
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#steps').addEventListener('click', (e) => { const b = e.target.closest('button[data-step]'); if (b) { step = +b.dataset.step; render(); } });

function copySummary() {
  const text = $('#summary').textContent;
  const done = () => { const t = $('#toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1200); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (_) {} ta.remove(); }
}
$('#btnCopy').onclick = copySummary;

$('#btnReset').onclick = () => {
  if (!confirm('새 상담을 시작할까요? 입력한 고객 정보가 모두 지워집니다.')) return;
  cust = blankCust(); calc = blankCalc(); step = 0; combineTouched = false;
  document.querySelectorAll('#custbar [data-f]').forEach((el) => { if (el.type === 'checkbox') el.checked = false; else el.value = ''; });
  closeModals(); render();
};

/* 반론 대응 (D) */
let objKw = '';
function openObj() { $('#objModal').classList.add('open'); $('#objSearch').focus(); $('#objSearch').select(); renderObj(); }
function closeModals() { document.querySelectorAll('.modal').forEach((m) => m.classList.remove('open')); }
function renderObj() {
  const q = $('#objSearch').value.trim();
  $('#objKw').innerHTML = OBJECTION_KEYWORDS.map((k) => `<button data-kw="${esc(k)}" class="${objKw === k ? 'on' : ''}">${esc(k)}</button>`).join('');
  const hit = OBJECTIONS.map((o, i) => ({ o, i })).filter(({ o }) => {
    const hay = [o.title, o.answer, ...(o.keywords || [])].join(' ');
    return (!q || hay.includes(q)) && (!objKw || hay.includes(objKw));
  });
  $('#objList').innerHTML = !OBJECTIONS.length
    ? `<div class="empty">반론 대응 데이터가 아직 없습니다.<br>"반론 대응 32개" PDF가 첨부되지 않아, 파일 상단 <b>OBJECTIONS</b> 배열이 비어 있어요.</div>`
    : hit.length ? hit.map(({ o, i }) => `<button data-obj="${i}">${esc(o.title)}</button>`).join('') : `<div class="empty">검색 결과 없음</div>`;
}
$('#btnObj').onclick = openObj;
$('#objSearch').addEventListener('input', renderObj);
$('#objKw').addEventListener('click', (e) => { const b = e.target.closest('[data-kw]'); if (b) { objKw = objKw === b.dataset.kw ? '' : b.dataset.kw; renderObj(); } });
$('#objList').addEventListener('click', (e) => {
  const b = e.target.closest('[data-obj]'); if (!b) return;
  const o = OBJECTIONS[+b.dataset.obj];
  $('#ansTitle').textContent = o.title; $('#ansBody').textContent = o.answer;
  $('#objModal').classList.remove('open'); $('#ansModal').classList.add('open');
});
document.querySelectorAll('.modal').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) closeModals(); }));

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  const modalOpen = !!document.querySelector('.modal.open');
  if (e.key === 'Escape') { if (modalOpen) { closeModals(); e.preventDefault(); } else if (typing) document.activeElement.blur(); return; }
  if (e.altKey && (e.key === 'c' || e.key === 'C' || e.code === 'KeyC')) { e.preventDefault(); copySummary(); return; }
  if (typing || modalOpen) return;
  if (e.key === '/' || e.key === 'F2') { e.preventDefault(); openObj(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
});

renderMonthBadges();
render();
})();
</script>
</body>
</html>
