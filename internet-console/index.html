<style>
:root {
  color-scheme: light;
  --bg: #f3f5f8; --panel: #ffffff; --panel2: #f7f9fc; --line: #dbe1e9; --text: #18212e; --muted: #687384;
  --accent: #1f6feb; --accent-weak: #e7f0ff; --fill: #0b4fb3; --fill-bg: #e9f1ff; --blank: #d9480f;
  --red: #d92d20; --red-weak: #fdeceb; --red-line: #f4bcb6; --amber: #a85a00; --amber-weak: #fff4e0; --amber-line: #f0d29e;

}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
body { display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); height: 100vh; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }

/* 상단 */
.topbar { box-shadow: 0 1px 0 var(--line); display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
.topbar h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: -0.2px; }
.topbar .sp { flex: 1; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge.red { background: var(--red-weak); color: var(--red); border: 1px solid var(--red-line); }
.badge.amber { background: var(--amber-weak); color: var(--amber); border: 1px solid var(--amber-line); }
.badge.green { background: var(--green-weak); color: var(--green); border: 1px solid var(--green-line); }
.badge.gray { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.btn.danger { border-color: var(--red-line); color: var(--red); }
kbd { font-family: ui-monospace, monospace; font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--muted); }

/* 스크립트 안 입력칸 / 답변 버튼 */
.inl { font: inherit; font-weight: 700; color: var(--fill); background: var(--fill-bg); border: 0; border-bottom: 2px solid var(--accent);
  border-radius: 5px 5px 0 0; padding: 0 6px; margin: 0 2px; min-width: 3ch; max-width: 100%; vertical-align: baseline; }
.inl::placeholder { color: var(--blank); opacity: .75; font-weight: 600; }
.inl:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: #fff; }
.inl[type="date"] { font-size: .8em; padding: 2px 6px; }
.inl[type="number"] { width: 3.2em; }
.ans { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -4px 0 20px; padding: 10px 12px;
  background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px; }
.ans .q { width: 100%; font-size: 13px; color: var(--muted); font-weight: 700; }
.ans .seg button, .ans > button { font-size: 16px; padding: 7px 13px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
.ans > button.on, .ans .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.ans > button:disabled { opacity: .4; }
.ans .sub { font-size: 12px; opacity: .8; margin-left: 4px; }
.ans .divider { width: 100%; height: 0; }
.how { display: inline-block; font-size: 14px; font-weight: 400; color: var(--muted); line-height: 1.5; margin: 2px 0 4px; }
.info { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; font-size: 14px; align-items: center; }
.info .k { color: var(--muted); font-size: 13px; }
.info .v.none { color: var(--blank); }
.info button { font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--accent); }

/* 메인 */
main { display: grid; grid-template-columns: minmax(0, 1fr) 560px; min-height: 0; }
#scriptPane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px 0; }
.steps button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
.steps button.on { background: var(--accent-weak); color: var(--text); border-color: var(--accent); font-weight: 700; }
.steps button.done { color: var(--text); }
.card { flex: 1; overflow: auto; margin: 12px 20px; padding: 26px 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.card .stitle { font-size: 15px; color: var(--accent); font-weight: 700; margin-bottom: 14px; }
.card .stitle span { color: var(--muted); font-weight: 500; margin-left: 6px; }
.card p { font-size: 27px; line-height: 1.75; margin: 0 0 18px; letter-spacing: -0.3px; word-break: keep-all; }
.card p.note { font-size: 16px; color: var(--muted); line-height: 1.6; }
.card ul { font-size: 23px; line-height: 1.7; margin: 0 0 18px; padding-left: 28px; }
.fill { color: var(--fill); font-weight: 700; background: var(--fill-bg); border-radius: 4px; padding: 0 3px; }
.blank { color: var(--blank); font-weight: 700; border-bottom: 2px dashed var(--blank); }
.nav { display: flex; align-items: center; gap: 12px; padding: 0 20px 14px; }
.nav .btn { font-size: 18px; padding: 10px 22px; }
.nav .pos { color: var(--muted); font-size: 14px; }

/* 사이드 */
#side { overflow: auto; padding: 12px 16px 24px; min-height: 0; }
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.sec h2 { font-size: 14px; margin: 0 0 10px; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.row { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: start; margin-bottom: 8px; }
.row > .lb { font-size: 13px; color: var(--muted); padding-top: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; font-size: 14px; }
.seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.seg button:disabled { opacity: .35; cursor: not-allowed; }
.opt { display: flex; align-items: center; gap: 6px; font-size: 14px; margin: 3px 0; }
.opt input { width: 16px; height: 16px; }
.opt .mut, .mut { color: var(--muted); font-size: 12px; }
.opt.dis { opacity: .45; }
select.sm { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font-size: 13px; }
.res { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.res .box { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.res .box .k { font-size: 12px; color: var(--muted); }
.res .box .v { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; margin-top: 2px; }
.res .box .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.res .box.big { grid-column: 1 / -1; border-color: var(--green-line); background: var(--green-weak); }
.res .box.big .v { font-size: 30px; color: var(--green); }
.breakdown { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
.pname { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
.warns { display: flex; flex-direction: column; gap: 6px; }
.warn { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; line-height: 1.45; padding: 7px 10px; border-radius: 8px; }
.warn.red { background: var(--red-weak); border: 1px solid var(--red-line); }
.warn.red b { color: var(--red); }
.warn.amber { background: var(--amber-weak); border: 1px solid var(--amber-line); }
.warn.amber b { color: var(--amber); }
table.cmp { width: 100%; border-collapse: collapse; font-size: 13px; }
table.cmp th, table.cmp td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: top; }

table.cmp td:first-child, table.cmp th:first-child { text-align: left; }
table.cmp tr.sel td { background: var(--accent-weak); }
table.cmp .sup { font-weight: 800; color: var(--green); font-size: 15px; }

footer { display: flex; gap: 10px; align-items: center; padding: 10px 16px; background: var(--bar); border-top: 1px solid var(--line); }

.toast.show { opacity: 1; }

<div class="modal" id="objModal">
  <div class="mbox">
    <h3>반론 대응 <span class="mut">Esc 닫기</span></h3>
    <input class="search" id="objSearch" placeholder="반론 검색 (예: 고민, 본사)">

</div>

<script>
(() => {
'use strict';

/* ───────── 유틸 ───────── */
const $ = (s) => document.querySelector(s);
const won = (n) => (n == null || isNaN(n)) ? '-' : Math.round(n).toLocaleString('ko-KR');
const exVat = (v) => Math.round(v / 1.1);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CARRIERS = ['kt', 'lg', 'sk', 'sky'];
const SPEED_ORDER = ['100M', '200M', '500M', '1G'];
const SPEED_TALK = { '100M': '100메가', '200M': '200메가', '500M': '500메가', '1G': '1기가' };
const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
const CUR_TO_KEY = { 'KT': 'kt', 'LG U+': 'lg', 'SK': 'sk', '스카이라이프': 'sky' };
// 휴대폰 결합 대상: 같은 통신사끼리만. 스카이는 스카이 알뜰폰만 결합 가능, 그 외 알뜰폰은 결합 대상 없음
const MOBILE_TO_KEY = { 'KT': 'kt', 'LG U+': 'lg', 'SKT': 'sk', '스카이 알뜰폰': 'sky' };

function parseDate(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function fmtDate(s) { const d = parseDate(s); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일(${WEEK[d.getDay()]})` : ''; }
function fmtDateTalk(s) { const d = parseDate(s); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일` : ''; }

/* ───────── 상태 (고객 정보는 메모리에만 — 저장 안 함) ───────── */
const blankCust = () => ({ name: '', curCarrier: '', contractEnd: '', moveDate: '', installDate: '', installTime: '', mobile: '', tvUse: '', tvCount: '', biz: false, bizType: '', nextDay: '' });
const blankCalc = () => ({
  carrier: 'sk', type: 'tv', speed: '500M', tier: 3, productId: null,
  soho: false, combine: false, ktBracket: 'flat', skDesk: 'SKB', addTvOpt: {},
  usim: false, usimPlan: 69, usimKind: 'general',
  addons: {}, deds: {}, dayMode: 'auto',
});
let cust = blankCust();
let calc = blankCalc();
let step = 0;
let combineTouched = false;

/* ───────── 상품 선택 ───────── */
function productsOf(key, type) { return DATA[key].products.filter((p) => p.type === type); }
function speedsOf(key, type) { return SPEED_ORDER.filter((s) => productsOf(key, type).some((p) => p.speed === s)); }
function pickProduct(key, type, speed, tier, preferId) {
  const list = productsOf(key, type).filter((p) => p.speed === speed);
  if (!list.length) return null;
  if (preferId) { const f = list.find((p) => p.id === preferId); if (f) return f; }
  if (type === 'net') return list[0];
  const t = DATA[key].defaultTier || tier; // 통신사별 기본 안내 TV 우선
  const ranked = list.filter((p) => p.tier > 0 && !p.notRecommended).sort((a, b) => Math.abs(a.tier - t) - Math.abs(b.tier - t) || b.tier - a.tier);
  return ranked[0] || list[0];
}
function currentProduct() {
  const c = calc;
  if (!speedsOf(c.carrier, c.type).includes(c.speed)) c.speed = speedsOf(c.carrier, c.type).includes('500M') ? '500M' : speedsOf(c.carrier, c.type)[0];
  const p = pickProduct(c.carrier, c.type, c.speed, c.tier, c.productId);
  c.productId = p ? p.id : null;
  return p;
}
function installDay() {
  if (calc.dayMode !== 'auto') return calc.dayMode;
  const d = parseDate(cust.installDate);
  if (!d) return 'weekday';
  return (d.getDay() === 0 || d.getDay() === 6) ? 'weekend' : 'weekday';
}

/* ───────── 계산 ─────────
   opt.withExtras=false → 비교표용(추가상품/차감 제외) */
function compute(key, p, opt = {}) {
  const C = DATA[key];
  const withExtras = opt.withExtras !== false;
  const day = installDay();
  const r = { key, p, notes: [], blocked: [], items: [] };
  if (!p) return null;

  // 월요금
  r.feeAdds = [];
  r.feeHow = p.exVat != null ? `시트 미결합 ${won(p.exVat)}원 × 1.1(부가세) = ${won(p.feeVat)}원` : `시트 월요금(부가세 포함) ${won(p.feeVat)}원`;
  let feeVat = p.feeVat, feeEx = p.exVat != null ? p.exVat : exVat(p.feeVat);
  let combVat = null, combEx = null, mobileDisc = null, combNote = '';
  if (calc.combine && combinable(key) === false && key === calc.carrier) combNote = `휴대폰 ${cust.mobile} → ${C.short} 인터넷과 결합 불가`;
  if (useCombine(key)) {
    if (key === 'sk') {
      combVat = p.combVat; combEx = p.combExVat; mobileDisc = C.combine.mobile1Line[p.speed];
      combNote = `휴대폰 결합: 시트 결합 ${won(p.combExVat)}원 + VAT`;
      r.combHow = `시트 결합 ${won(p.combExVat)}원 × 1.1(부가세) = ${won(combVat)}원`;
    } else if (key === 'kt') {
      const sk = p.speed === '100M' ? '100M' : '500M/1G';
      let disc;
      if (calc.ktBracket === 'flat') { disc = C.combine.flatNetDiscount; combNote = '정액결합 인터넷할인 5,500원'; }
      else { const i = +calc.ktBracket; disc = C.combine.netDiscount[sk][i]; mobileDisc = C.combine.mobileDiscount[sk][i] || null; combNote = `총액결합(휴대폰 ${C.combine.brackets[i]}) 인터넷할인 ${won(disc)}원`; }
      combVat = feeVat - disc; combEx = exVat(combVat);
      r.combHow = `월요금 ${won(feeVat)}원 − ${calc.ktBracket === 'flat' ? '정액결합' : '총액결합'} 인터넷할인 ${won(disc)}원 = ${won(combVat)}원`;
    } else if (key === 'lg') {
      const disc = C.combine.netDiscount[p.speed];
      combVat = feeVat - disc; combEx = exVat(combVat); combNote = `참쉬운가족결합 인터넷할인 ${won(disc)}원 (추정)`;
      r.combHow = `월요금 ${won(feeVat)}원 − 참쉬운가족결합 인터넷할인 ${won(disc)}원 = ${won(combVat)}원`;
    } else {
      combNote = '결합 할인표 없음 (스카이알뜰폰만 결합 가능)';
    }
  }

  // 지원금
  let net = p.support;
  if (key === 'lg' && calc.soho) {
    if (p.soho == null) { r.notes.push('이 상품은 소호 지원금이 시트에 없음 — 일반 지원금으로 표시'); }
    else net = p.soho;
  }
  const sheetNet = net;
  net = Math.max(sheetNet - MARGIN.baseCut, 0);
  const netLabel = calc.soho && key === 'lg' && p.soho != null ? '소호 지원금' : '인터넷 지원금';
  r.items.push([netLabel, net]);
  r.supHow = [`${netLabel} ${sheetNet} − ${MARGIN.baseCut}(차감) = ${net}`];

  let usim = 0;
  if (calc.usim) {
    if (key === 'kt') {
      if (calc.usimPlan >= C.usim.minPlan) usim = (C.usim[calc.usimKind] || {})[p.id] || 0;
      else r.notes.push('KT 동판은 유심 80k 이상만 금액 있음');
    } else if (key === 'sk') {
      const t = C.usim.tiers.filter((x) => x <= calc.usimPlan).pop();
      if (t == null) r.notes.push('SK 동판은 유심 33 요금제 이상');
      else {
        const tbl = calc.usimKind === 'family' ? C.usim.family : (p.type === 'tv' ? C.usim.tv : C.usim.netOnly);
        if (tbl[t] == null) r.notes.push('SK 인터넷 단독 + 유심 동판 금액 시트 빈칸');
        else usim = tbl[t];
      }
    } else {
      r.notes.push(`${C.short} 시트에 유심 동판 표 없음`);
    }
    if (usim) { r.items.push(['유심 동판', usim]); r.supHow.push(`유심 동판 ${usim}`); }
  }

  // 기존 통신사 조건
  let carrierDeduct = 0;
  if (key === 'sky') {
    if (p.home30 && C.rules.home30BlockedFrom.includes(cust.curCarrier)) r.blocked.push(`기존 ${cust.curCarrier} 전환 — 30% 홈결합 불가`);
    if (cust.curCarrier === 'KT' && !p.home30) { carrierDeduct = -C.rules.fromKtDeduct; r.items.push(['KT 전환 차감', carrierDeduct]); r.supHow.push(`KT 전환 차감 ${carrierDeduct}`); }
  }

  // 추가상품 / 차감
  let addSup = 0, addFee = 0, addInstall = 0;
  // 추가 TV: 고객 TV 대수 - 1 만큼 대당 요금·설치비·지원금 추가 (비교표에도 반영)
  const extra = extraTvCount();
  if (extra > 0 && p.type === 'tv' && C.addTv) {
    const o = addTvChoice(key, p);
    if (o) {
      const fee = o.total * extra, inst = C.install[C.addTv.install][day] * extra;
      const unitSup = Math.max(o.support - (o.cut || 0), 0);
      addFee += fee; addInstall += inst; addSup += unitSup * extra;
      r.supHow.push(`추가 TV ${o.label} (${o.support}${o.cut ? ` − ${o.cut}(차감)` : ''})${extra > 1 ? ` × ${extra}대` : ''} = ${unitSup * extra}`);
      r.addTv = { n: extra, o, fee, inst, unitInst: C.install[C.addTv.install][day] };
      r.feeAdds.push([`추가 TV ${o.label} ${won(o.total)}원${extra > 1 ? ` × ${extra}대` : ''}`, fee]);
      r.items.push([`추가 TV ${extra}대 (${o.label})`, unitSup * extra]);
    }
  }
  if (withExtras) {
    for (const a of C.addons) {
      const v = calc.addons[a.id];
      if (!v || !addonAllowed(a, p)) continue;
      const fee = a.optionsFrom ? C[a.optionsFrom][+v - 1].total : a.feeVat;
      addSup += a.support; addFee += fee;
      if (fee) r.feeAdds.push([`${a.name} ${won(fee)}원`, fee]);
      if (a.install) addInstall += C.install[a.install][day];
      r.items.push([a.name + (a.optionsFrom ? ` (${C[a.optionsFrom][+v - 1].label})` : ''), a.support]);
      if (a.support) r.supHow.push(`${a.name} ${a.support}`);
    }
    for (const d of C.deductions) if (calc.deds[d.id]) { addSup += d.support; r.items.push([d.name, d.support]); r.supHow.push(`${d.name} ${d.support}`); }
  }

  // 같은 통신사끼리는 이동 불가 → 지원금 없음
  const same = CUR_TO_KEY[cust.curCarrier] === key;
  if (same) {
    r.blocked.unshift(`현재 ${cust.curCarrier} 사용 중 — 같은 통신사로는 이동 불가 (지원금 지급 없음)`);
    net = 0; usim = 0; addSup = 0; carrierDeduct = 0;
    r.items = [['동일 통신사 이동 불가', 0]];
    r.supHow = [];
  }
  const baseInstall = C.install[p.type === 'net' ? 'net' : 'tv'][day];
  const totalSup = net + usim + addSup + carrierDeduct;
  // KT: 다음날 최저가이드 금액(이마트 금액권 + 현금) 먼저, 차액은 다음주 금요일
  let pay = null;
  if (p.guide != null && !same) {
    if (p.guide > p.support) r.notes.push(`가이드(${p.guide})가 지원금 합계(${p.support})보다 큼 — 시트 확인 필요`); // TODO 확인필요 (LG 100M 단독 20 > 18)
    const g = key === 'sk' && calc.skDesk === 'SKT' && p.guideSkt != null ? p.guideSkt : p.guide;
    const first = Math.min(g, totalSup);
    const gift = Math.min(p.gift || 0, first);
    pay = { first, gift, cash: first - gift, rest: Math.max(totalSup - first, 0), when: C.payTiming === 'nextDay' ? '다음날' : '설치 당일' };
  }
  Object.assign(r, {
    same, pay,
    feeVat: feeVat + addFee, feeEx: feeEx + exVat(addFee),
    combVat: combVat == null ? null : combVat + addFee, combEx: combEx == null ? null : combEx + exVat(addFee),
    mobileDisc, combNote, net, usim, addSup, carrierDeduct,
    total: net + usim + addSup + carrierDeduct,
    install: baseInstall + addInstall, baseInstall, day,
  });
  return r;
}
// 요금 계산법 (회색 작은 글씨)
function howText(r, comb) {
  if (!r) return '';
  const base = comb ? r.combHow : r.feeHow;
  if (!base) return '';
  const adds = r.feeAdds.map(([l]) => ` + ${l}`).join('');
  return `${comb ? '결합 요금 계산' : '요금 계산'}: ${base}${adds ? adds + ` = ${won(comb ? r.combVat : r.feeVat)}원` : ''}`;
}
// 지원금 계산법 (차감 내역 포함, 회색 작은 글씨)
function supText(r) {
  if (!r || !r.supHow || !r.supHow.length) return '';
  return `지원금 계산: ${r.supHow.join(' · ')} → 총 ${r.total}만원`;
}
const SUPHOW = (r) => { const t = supText(r); return t ? `<br><span class="how">${esc(t)}</span>` : ''; };
const HOW = (r, comb) => { const t = howText(r, comb); return t ? `<br><span class="how">${esc(t)}</span>` : ''; };
// 약정 만료 '모름'일 때 참고사항 (현재 인터넷 통신사별)
function contractUnknownNote() {
  const k = CUR_TO_KEY[cust.curCarrier];
  const sk = `<p class="note">(SK일 경우) 약정조회 가능 — 고객님 <b>성함 · 생년월일 · 휴대폰번호 · 현재 설치 주소</b> 확인해서 조회</p>`;
  const ktlg = `<p>설치하신 지 3년 지나셨을까요?</p><p class="note">(KT, LG일 경우) 설치 후 3년 지났는지로 약정 만료 확인</p>`;
  if (k === 'sk') return sk;
  if (k === 'kt' || k === 'lg') return ktlg;
  return sk + ktlg;
}
function combinable(key) { return cust.mobile ? MOBILE_TO_KEY[cust.mobile] === key : null; }
function useCombine(key) { return key === calc.carrier ? calc.combine && combinable(key) !== false : combinable(key) === true; }
function extraTvCount() { return cust.tvUse === '사용' ? Math.max((Number(cust.tvCount) || 1) - 1, 0) : 0; }
function addTvList(C, p) { return C.addTv ? C.addTv.options.map((o, i) => ({ o, i })).filter(({ o }) => !o.speeds || o.speeds.includes(p.speed)) : []; }
function addTvChoice(key, p) {
  const list = addTvList(DATA[key], p);
  const sel = list.find((x) => x.i === calc.addTvOpt[key]);
  return (sel || list.find((x) => x.o.recommended) || list[0] || {}).o || null;
}
function addonAllowed(a, p) {
  if (a.discontinued) return false;
  if (a.tvOnly && p.type !== 'tv') return false;
  if (a.minSpeed && SPEED_ORDER.indexOf(p.speed) < SPEED_ORDER.indexOf(a.minSpeed)) return false;
  return true;
}

/* ───────── 경고 (E) ───────── */
function warnings(r) {
  const w = [];
  if (!r) return w;
  const C = DATA[r.key], key = r.key;
  w.push(['red', '지원금 환수', '1년 내 해지 · 요금 미납 · 미접속(가개통 직권해지) · 명의변경/일시정지 · 상품 하향 시 지원금 전액 환수']);
  const curKey = CUR_TO_KEY[cust.curCarrier];
  if (C.rules.rejoinDays && curKey !== key) w.push(['amber', '재가입 제한', `${C.name}: 본인/가족명의로 ${C.name} 해지 후 ${C.rules.rejoinDays}일 이내 재가입 불가 (지원금 전액 환수) — 최근 해지 이력 확인`]);
  if (key === 'sky' && cust.curCarrier === 'KT') w.push(['red', 'KT 전환 차감', `KT → 스카이 전환: 지원금 ${C.rules.fromKtDeduct}만원 차감 (정책 마이너스 되지 않게 주의)`]);
  r.blocked.forEach((b) => w.push(['red', '접수 불가', b]));
  if (key === 'lg' && cust.biz) {
    const hit = C.rules.bannedBiz.find((b) => cust.bizType && cust.bizType.includes(b.replace('업소', '')));
    w.push([hit ? 'red' : 'amber', hit ? `접수 불가: ${hit}` : 'LG 사업장 확인', `LG 접수·개통 불가 업소: ${C.rules.bannedBiz.join(', ')} (개통되어도 전액 환수)`]);
  }
  if (calc.usim) {
    w.push(['red', '유심 유지', '유심 개통일로부터 7개월 의무 유지 (기기변경·요금제 하향·명의변경·해지 시 전액 반환) · 선택약정 12개월/24개월 유지']);
    if (key === 'kt' && calc.usimPlan < DATA.kt.rules.usimMinPlan) w.push(['red', 'KT 유심', 'KT 유심 37k 요금제 이상 필수']);
    if (key === 'kt' && calc.deds['kt-ttaro']) w.push(['red', 'KT 유심', '따로 살아도 가족결합 진행불가 (유심 동판)']);
    if (key === 'sk') w.push(['amber', 'SK 유심', '인터넷 개통일 기준 +30일 안에 유심 개통']);
  }
  if (r.p.notRecommended) w.push(['red', '비권장 상품', `${C.short} ${r.p.tv}는 가입 비권장 — 최소 스탠다드 이상으로 권장`]);
  if (key === 'sk' && useCombine(key)) w.push(['amber', 'SK 결합', 'SK 모든 결합은 30일 내로만 가능 · 해피콜 필수 진행']);
  if (cust.biz && key !== 'lg') w.push(['amber', '사업장', '사업장 설치 — 통신사별 사업자 접수 조건 확인']);
  if (r.addTv) w.push([r.addTv.o.notRecommended ? 'red' : 'amber', '추가 TV', `TV ${cust.tvCount}대 → 추가 ${r.addTv.n}대 (${r.addTv.o.label}${r.addTv.o.notRecommended ? ' · 비권장' : ''}): 월 +${won(r.addTv.fee)}원, 설치비 +${won(r.addTv.inst)}원 (대당 ${won(r.addTv.unitInst)}원)`]);

    lg: `<p>접수 후에 해피콜 전화는 따로 없으시고, 인증전화만 가실거예요</p>
    <p class="note">LG 인증전화 번호: 010, 1644 로 안내</p>`,
  }[calc.carrier] || `<p>접수 후 센터에서해피콜팀, 설치팀에서 각각 연락가실건데</p>
    <p>해피콜 전화가 갈 때 지원받는 현금 금액을 확인하는 경우가 있는데,<br>이때는 원래 가이드로는 더 적은 금액인데 제가 추가로 지원금을 더 넣어드린 거니까<br>그냥 네라고 말씀해주시면되세요</p>`;
  steps.push({ t: '해피콜/설치팀 안내', h: afterCall });

  steps.push({ t: '마무리', h: `
    <p>저는 담당자 ${IN('agent', '○○○')}이구요 통화 끝나면 문자로 명함 보내드릴테니까 저장해두셨다가 문의사항 있으시면 연락주시구요.</p>` });
  return steps;
}

function diffText(r) { if (r && r.pay) return `${r.pay.when} ${r.pay.first}만원${r.pay.gift ? `(금액권 ${r.pay.gift} + 현금 ${r.pay.cash})` : '(현금)'} · 차액 ${r.pay.rest}만원 다음주 금요일`; return cust.nextDay !== '' && r ? `차액 ${r.total - Number(cust.nextDay)}만원` : '다음날 지급액 입력 시 차액 계산'; }
let lastSteps = [];

    ['먼저 지급', lastResult && lastResult.pay ? `${lastResult.pay.when} ${lastResult.pay.first}만원${lastResult.pay.gift ? ` (금액권 ${lastResult.pay.gift}+현금 ${lastResult.pay.cash})` : ''} · 자동` : (cust.nextDay !== '' ? cust.nextDay + '만원' : ''), '요금/설치비/지급일'],

function renderMonthBadges() {

  }).join(' ') + (CARRIERS.some((k) => DATA[k].baseMonth < ym) ? ` <span class="badge amber">${now.getMonth() + 1}월 정책 업데이트 필요</span>` : '');

}

  if (calc.type === 'tv') h += `<div class="row"><div class="lb">TV 채널</div>${seg('productId', tvs.map((x) => [x.id, x.tv + (x.notRecommended ? ' · 비권장' : '') + (x.tier && x.tier === DATA[calc.carrier].defaultTier ? ' · 기본안내' : '')]), p && p.id)}</div>`;

  // 결합

  if (useCombine(key) && key === 'sky') comb += `<div class="mut" style="margin-top:4px">스카이 결합표 없음 (스카이알뜰폰만 가능)</div>`;

  // 유심 동판

    } else {
      ad += `<label class="opt ${ok ? '' : 'dis'}"><input type="checkbox" data-addon="${a.id}" ${a.group ? `data-group="${a.group}"` : ''} ${calc.addons[a.id] && ok ? 'checked' : ''} ${ok ? '' : 'disabled'}> ${esc(a.name)} <span class="mut">${a.feeVat ? won(a.feeVat) + '원' : ''}</span> ${sup} <span class="mut">${why}</span></label>`;

    } else tvh += `<div class="mut" style="margin-top:4px">인터넷+TV 상품에서 적용</div>`;
    h += `<div class="row"><div class="lb">추가 TV<br><span class="mut">(TV 대수 - 1)</span></div><div>${tvh}</div></div>`;
  }
  h += `<div class="row"><div class="lb">추가 셋톱/<br>와이파이</div><div>${ad || '<span class="mut">없음</span>'}</div></div>`;
  if (C.deductions.length) h += `<div class="row"><div class="lb">차감</div><div>${C.deductions.map((d) => `<label class="opt"><input type="checkbox" data-ded="${d.id}" ${calc.deds[d.id] ? 'checked' : ''}> ${esc(d.name)} <span class="mut">${d.support}</span></label>`).join('')}</div></div>`;
  const autoLbl = cust.installDate ? `자동(${fmtDate(cust.installDate)})` : '자동(날짜 미입력→평일)';
  h += `<div class="row"><div class="lb">설치 요일</div>${seg('dayMode', [['auto', autoLbl], ['weekday', '평일'], ['weekend', '주말']], calc.dayMode)}</div>`;

function compareRows() {
  return CARRIERS.map((k) => {
    const sp = speedsOf(k, calc.type).includes(calc.speed) ? calc.speed : null;
    const p = sp ? pickProduct(k, calc.type, sp, calc.tier) : null;
    return { k, r: p ? compute(k, p, { withExtras: false }) : null };
  });
}
function renderCompare() {
  const rows = compareRows();
  const score = (x) => !x.r ? -999 : x.r.same ? -500 : x.r.total;
  rows.sort((a, b) => score(b) - score(a));
  $('#compare').innerHTML = `<table class="cmp"><thead><tr><th>통신사 · 상품</th><th>월요금</th><th>결합 시</th><th>설치비</th><th>지원금</th></tr></thead><tbody>${
    rows.map(({ k, r }) => r ? `<tr class="${k === calc.carrier ? 'sel' : ''}" data-pick="${k}" style="cursor:pointer">
      <td><b>${esc(DATA[k].short)}</b> ${r.same ? '<span class="badge red">동일 통신사 불가</span>' : r.blocked.length ? '<span class="badge red">불가</span>' : ''}<br><span class="mut">${esc(r.p.name)}</span></td>
      <td>${won(r.feeVat)}</td>
      <td>${r.combVat != null ? won(r.combVat) : '-'}</td>
      <td>${won(r.install)}</td>
      <td><span class="sup">${r.total}</span><br><span class="mut">${r.net}${r.usim ? ` +동판${r.usim}` : ''}${r.carrierDeduct ? ` ${r.carrierDeduct}` : ''}</span></td></tr>`
      : `<tr><td><b>${esc(DATA[k].short)}</b></td><td colspan="4" class="na">${esc(calc.speed)} 상품 없음</td></tr>`).join('')
  }</tbody></table><div class="mut" style="margin-top:6px">행 클릭 → 그 통신사로 계산기 전환 · 요금은 모두 VAT 포함</div>`;
}

function renderWarns(r) {
  const w = warnings(r);
  $('#warnCnt').textContent = w.filter((x) => x[0] === 'red').length || '';
  $('#warns').innerHTML = w.map(([lv, t, d]) => `<div class="warn ${lv}"><span class="badge ${lv}">${esc(t)}</span><span>${esc(d)}</span></div>`).join('');
}

function renderScript(r) {
  const steps = buildSteps(r);
  lastSteps = steps;
  step = Math.max(0, Math.min(step, steps.length - 1));
  $('#steps').innerHTML = steps.map((s, i) => `<button data-step="${i}" class="${i === step ? 'on' : i < step ? 'done' : ''}">${i + 1}. ${esc(s.t)}</button>`).join('');
  $('#card').innerHTML = `<div class="stitle">${step + 1}. ${esc(steps[step].t)}<span>${step + 1} / ${steps.length}</span></div>${steps[step].h}`;
  $('#pos').textContent = `${step + 1} / ${steps.length}`;
  $('#prev').disabled = step === 0;
  $('#next').disabled = step === steps.length - 1;
  return steps.length;
}

function summaryText(r) {
  if (!r) return '';
  const C = DATA[r.key];
  const parts = [];
  parts.push(`[${C.short}${r.key === 'lg' && calc.soho ? ' 소호' : ''}] ${r.p.name}`);
  const extras = r.items.slice(1).map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join(', ');
  parts.push(`월 ${won(r.feeVat)}원(VAT포함)` + (r.combVat != null ? ` · 결합 ${won(r.combVat)}원(VAT포함)` : ''));
  parts.push(`지원금 총 ${r.total}만원 (인터넷 ${r.net}${extras ? ', ' + extras : ''})` + (r.pay ? ` · ${r.pay.when} ${r.pay.gift ? `${C.giftName} ${r.pay.gift}+현금 ${r.pay.cash}` : `현금 ${r.pay.first}`}, 차액 ${r.pay.rest} 다음주 금요일` : ''));
  parts.push(`설치 ${cust.installDate ? fmtDate(cust.installDate) : '미정'}${cust.installTime ? ' ' + cust.installTime : ''} · 설치비 ${won(r.install)}원(${r.day === 'weekend' ? '주말' : '평일'})`);
  const c = [];
  if (cust.name) c.push(`고객 ${cust.name}`);
  if (cust.curCarrier) c.push(`현재 ${cust.curCarrier}${cust.contractEnd ? `(약정 ${cust.contractEnd})` : ''}`);
  if (cust.mobile) c.push(`휴대폰 ${cust.mobile}`);
  if (cust.tvUse) c.push(`TV ${cust.tvUse}${cust.tvCount ? ' ' + cust.tvCount + '대' : ''}`);
  if (cust.moveDate) c.push(`이사 ${fmtDate(cust.moveDate)}`);
  if (cust.biz) c.push(`사업장${cust.bizType ? '(' + cust.bizType + ')' : ''}`);
  if (calc.usim) c.push(`유심 ${calc.usimPlan}k ${calc.usimKind === 'family' ? '패밀리' : '일반'}`);
  if (c.length) parts.push(c.join(' · '));
  return parts.join(' | ');
}

let lastResult = null;
function render() {
  const p = currentProduct();
  if (p && p.tier) calc.tier = p.tier;
  const r = p ? compute(calc.carrier, p) : null;
  lastResult = r;
  renderSide(p, r);
  renderScript(r);
}
function renderSide(p, r) {
  renderInfo();
  renderCalc(p);
  renderResult(r);
  renderCompare();
  renderWarns(r);
  $('#summary').textContent = summaryText(r);
}
// 입력 중에는 스크립트 카드를 다시 그리지 않음 (커서 유지)
function renderLive() {
  const p = currentProduct();
  const r = p ? compute(calc.carrier, p) : null;
  lastResult = r;
  renderSide(p, r);
  document.querySelectorAll('#card [data-show="diff"]').forEach((el) => { el.textContent = diffText(r); });
}

/* ───────── 이벤트 ───────── */
function setCust(f, v) {
  if (f === 'agent') { agentNm = v; try { localStorage.setItem('consoleAgentName', v); } catch (_) {} return; }
  cust[f] = v;
  if (f === 'biz') calc.soho = cust.biz;
  if (f === 'tvUse' && v) { calc.type = v === '사용' ? 'tv' : 'net'; calc.productId = null; if (v !== '사용') cust.tvCount = ''; }
  if (f === 'curCarrier' && CUR_TO_KEY[v] === calc.carrier) {
    const best = compareRows().filter((x) => x.r && !x.r.same).sort((a, b) => b.r.total - a.r.total)[0];
    if (best) { calc.carrier = best.k; calc.productId = null; calc.addons = {}; calc.deds = {}; }
  }
  if ((f === 'mobile' || f === 'curCarrier') && !combineTouched) calc.combine = MOBILE_TO_KEY[cust.mobile] === calc.carrier;
}
// 스크립트 안 입력칸: 글자 입력은 실시간 반영(카드는 유지), 날짜는 바로 전체 반영
$('#card').addEventListener('input', (e) => {
  const t = e.target; if (!t.matches('.inl')) return;
  setCust(t.dataset.f, t.value);
  if (t.type === 'text') t.size = Math.max(t.value.length, t.placeholder.length, 2) + 1;
  document.querySelectorAll(`#card .inl[data-f="${t.dataset.f}"]`).forEach((o) => { if (o !== t) o.value = t.value; });
  if (t.type === 'date') render(); else renderLive();
});
$('#card').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('.inl')) { e.preventDefault(); e.target.blur(); } });
$('#card').addEventListener('click', (e) => {
  const c = e.target.closest('button[data-cf]');
  if (c) {
    const f = c.dataset.cf; let v = c.dataset.v;
    if (f === 'biz') v = v === 'true';
    setCust(f, String(cust[f]) === String(v) && f !== 'biz' ? '' : v);
    render(); return;
  }
  onSetClick(e);
});
function onSetClick(e) {
  const b = e.target.closest('button[data-set]');
  if (b) {
    const k = b.dataset.set, v = b.dataset.v;
    if (k === 'carrier') { calc.carrier = v; calc.productId = null; calc.addons = {}; calc.deds = {}; if (!combineTouched) calc.combine = MOBILE_TO_KEY[cust.mobile] === v; }
    else if (k === 'type') { calc.type = v; calc.productId = null; }
    else if (k === 'speed') { calc.speed = v; calc.productId = null; }
    else if (k === 'productId') { calc.productId = v; }
    else if (k === 'extraTv') { const n = Number(v); if (n > 0) { cust.tvUse = '사용'; calc.type = 'tv'; } cust.tvCount = n > 0 ? String(n + 1) : (cust.tvUse === '사용' ? '1' : ''); }
    else if (k === 'soho' || k === 'combine' || k === 'usim') { calc[k] = v === '1'; if (k === 'combine') combineTouched = true; }
    else calc[k] = v;
    render(); return true;
  }
  return false;
}
$('#side').addEventListener('click', (e) => {
  if (onSetClick(e)) return;
  const j = e.target.closest('button[data-jump]');
  if (j) { const i = lastSteps.findIndex((x) => x.t === j.dataset.jump); if (i >= 0) { step = i; render(); if (isMobile()) setTab('script'); const el = $('#card .inl'); if (el) el.focus(); } return; }
  const tr = e.target.closest('tr[data-pick]');
  if (tr) { calc.carrier = tr.dataset.pick; calc.productId = null; calc.addons = {}; calc.deds = {}; render(); if (isMobile()) setTab('calc'); }
});
$('#side').addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.set === 'ktBracket') calc.ktBracket = t.value;
  else if (t.dataset.set === 'addTvOpt') calc.addTvOpt[calc.carrier] = Number(t.value);
  else if (t.dataset.set === 'usimPlan') calc.usimPlan = Number(t.value);
  else if (t.dataset.addon) {
    if (t.type === 'checkbox') {
      if (t.checked && t.dataset.group) DATA[calc.carrier].addons.filter((a) => a.group === t.dataset.group).forEach((a) => { calc.addons[a.id] = false; });
      calc.addons[t.dataset.addon] = t.checked;
    } else calc.addons[t.dataset.addon] = t.value;
  } else if (t.dataset.ded) calc.deds[t.dataset.ded] = t.checked;
  else return;
  render();
});

function go(d) { step += d; render(); }
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
$('#steps').addEventListener('click', (e) => { const b = e.target.closest('button[data-step]'); if (b) { step = +b.dataset.step; render(); } });

function copySummary() {
  const text = $('#summary').textContent;
  const done = () => { const t = $('#toast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1200); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (_) {} ta.remove(); }
}
$('#btnCopy').onclick = copySummary;

$('#btnReset').onclick = () => {
  if (!confirm('새 상담을 시작할까요? 입력한 고객 정보가 모두 지워집니다.')) return;
  cust = blankCust(); calc = blankCalc(); step = 0; combineTouched = false;
  closeModals(); render();
};

/* 반론 대응 (D) */
let objKw = '';
function openObj() { $('#objModal').classList.add('open'); $('#objSearch').focus(); $('#objSearch').select(); renderObj(); }
function closeModals() { document.querySelectorAll('.modal').forEach((m) => m.classList.remove('open')); }
function renderObj() {
  const q = $('#objSearch').value.trim();
  $('#objKw').innerHTML = OBJECTION_KEYWORDS.map((k) => `<button data-kw="${esc(k)}" class="${objKw === k ? 'on' : ''}">${esc(k)}</button>`).join('');
  const hit = OBJECTIONS.map((o, i) => ({ o, i })).filter(({ o }) => {
    const hay = [o.title, o.answer, ...(o.keywords || [])].join(' ');
    return (!q || hay.includes(q)) && (!objKw || hay.includes(objKw));
  });
  $('#objList').innerHTML = !OBJECTIONS.length
    ? `<div class="empty">반론 대응 데이터가 아직 없습니다.<br>"반론 대응 32개" PDF가 첨부되지 않아, 파일 상단 <b>OBJECTIONS</b> 배열이 비어 있어요.</div>`
    : hit.length ? hit.map(({ o, i }) => `<button data-obj="${i}"><span class="mut">${o.no}.</span> ${esc(o.title)}</button>`).join('') : `<div class="empty">검색 결과 없음</div>`;
}
$('#btnObj').onclick = openObj;
$('#objSearch').addEventListener('input', renderObj);
$('#objKw').addEventListener('click', (e) => { const b = e.target.closest('[data-kw]'); if (b) { objKw = objKw === b.dataset.kw ? '' : b.dataset.kw; renderObj(); } });
$('#objList').addEventListener('click', (e) => {
  const b = e.target.closest('[data-obj]'); if (!b) return;
  const o = OBJECTIONS[+b.dataset.obj];
  const r = lastResult;
  const fillTxt = (t) => t.replace(/\{지원금\}/g, r ? r.total : '○○').replace(/\{통신사\}/g, DATA[calc.carrier].short).replace(/\{설치비\}/g, r ? won(r.install) : '○○,○○○');
  $('#ansTitle').textContent = `${o.no}. ${o.title}`; $('#ansBody').textContent = fillTxt(o.answer);
  $('#ansTip').textContent = o.tip ? `상담원 메모: ${o.tip}` : '';
  $('#objModal').classList.remove('open'); $('#ansModal').classList.add('open');
});
document.querySelectorAll('.modal').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) closeModals(); }));

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  const modalOpen = !!document.querySelector('.modal.open');
  if (e.key === 'Escape') { if (modalOpen) { closeModals(); e.preventDefault(); } else if (typing) document.activeElement.blur(); return; }
  if (e.altKey && (e.key === 'c' || e.key === 'C' || e.code === 'KeyC')) { e.preventDefault(); copySummary(); return; }
  if (typing || modalOpen) return;
  if (e.key === '/' || e.key === 'F2') { e.preventDefault(); openObj(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
});

/* 모바일 탭 */
const isMobile = () => window.matchMedia('(max-width: 860px)').matches;
function setTab(t) {
  document.body.dataset.tab = t;
  document.querySelectorAll('#mtabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === t));
  window.scrollTo(0, 0);
}
$('#mtabs').addEventListener('click', (e) => { const b = e.target.closest('button[data-tab]'); if (b) setTab(b.dataset.tab); });

renderMonthBadges();
render();
})();
</script>
</body>
</html>
