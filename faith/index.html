<body>
  <main id="map"></main>
  <!-- 도장 잉크 번짐 (인물 도장·문양에 쓴다) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feComponentTransfer in="n" result="speck"><feFuncA type="discrete" tableValues="1 1 1 0.4 1 1"/></feComponentTransfer>
      <feComposite in="d" in2="speck" operator="in"/>
    </filter>
  </svg>
